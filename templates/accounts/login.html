{% extends 'base.html' %}
{% block title %}Iniciar sesión · Turno{% endblock %}
{% block content %}
<section class="login-centered">
<div class="panel auth"><p class="eyebrow">BIENVENIDO A TURNO</p><h2>Iniciar sesión</h2><p class="muted">Ingresa con tu nombre de usuario.</p>
<form method="post">{% csrf_token %}{% include 'fields.html' %}
{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
<button class="full">Entrar</button></form>
<p class="auth-link">¿Primera vez? <a href="{% url 'register' %}">Crear una cuenta</a></p>
</div></section>{% endblock %}
